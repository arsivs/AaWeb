<svg viewBox="0 0 1000 150" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" width="1000" height="150"><style>
svg{filter:drop-shadow(0 0 13px #2e76ff66) drop-shadow(0 0 8px #6583ff88)}
.wave-main,.wave-secondary,.wave-haze{fill:none;stroke-linecap:round}
.wave-main{stroke:url(#waveGradient);stroke-width:2.8;animation:waveMove 5.5s ease-in-out infinite alternate}
.wave-secondary{stroke:url(#waveGradient);stroke-width:1.5;opacity:.55;animation:waveMove 7s ease-in-out infinite alternate-reverse}
.wave-haze{stroke:url(#waveGradient);stroke-width:15;opacity:.22;filter:blur(11px);animation:waveMove 5.5s ease-in-out infinite alternate}
@keyframes waveMove{0%{transform:translateY(-9px) scaleY(.76)}50%{transform:translateY(7px) scaleY(1.12)}100%{transform:translateY(-4px) scaleY(.85)}}
@media(prefers-reduced-motion:reduce){.wave-main,.wave-secondary,.wave-haze{animation:none}}
</style>
        <defs><linearGradient id="waveGradient" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0576ff" stop-opacity="0"/><stop offset=".2" stop-color="#00aaff"/><stop offset=".48" stop-color="#3375ff"/><stop offset=".75" stop-color="#8d4cff"/><stop offset="1" stop-color="#9049ff" stop-opacity="0"/></linearGradient></defs>
        <path class="wave-haze" d="M0 76 C130 76 165 34 280 61 S445 122 560 87 S715 33 815 67 S935 81 1000 76"/>
        <path class="wave-secondary" d="M0 83 C120 78 177 48 275 65 S445 112 550 91 S700 45 815 67 S945 84 1000 79"/>
        <path class="wave-main" d="M0 76 C130 76 165 34 280 61 S445 122 560 87 S715 33 815 67 S935 81 1000 76"/>
      </svg>