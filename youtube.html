<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoX Andorid Auto</title>
<link rel="stylesheet" href="patch/styles/config.css">
<script src="https://www.youtube.com/iframe_api"></script>
<script src="patch/script/js.js" type="text/javascript"></script>
<style type="text/css">
:root {
    --bg: #07101f;
    --panel: #0c192c;
    --panel-light: #10213a;
    --border: #1b3555;
    --text: #f1f6ff;
    --muted: #91a5c2;
    --purple: #168cff;
    --blue: #42b5ff;
}
</style>
<script type="application/javascript">

window.addEventListener("autoxkey", function(event) {
    const keyCode = event.detail.keyCode;
    switch (keyCode) {
        case 87:
            if (!ytReady) break;
        	//deneme();
            yt.next();
            msg("ok", "Sonraki");
            break;

        case 88:
            if (!ytReady) break;
            yt.prev();
            msg("ok", "Önceki");
            //AutoXMedia.setPlaying(true);   // duraklat simgesi (çalıyor)
            break;

        case 126:
            msg("ok", "Oynat");
            AutoXMedia.setPlaying(true);  // oynat simgesi
            break;

        case 127:
            msg("ok", "Duraklat");
            AutoXMedia.setPlaying(false);  // oynat simgesi
            break;

        default:
        	deneme();
            msg("ok", "Diğer tuş:" + keyCode);
            //AutoXMedia.setPlaying(true);   // duraklat simgesi (çalıyor)
            break;
    }
});
window.addEventListener('autoxseek', function (e) {
	msg("ok", "Pozisyon:" + e.detail.position);
	//player.seekTo(e.detail.position, true);
});

function sendToCar(track) {
  if (window.AutoXMedia) {
    AutoXMedia.setNowPlaying(JSON.stringify(track));
  }
}

</script>
</head>

<body>

<div class="yt_content">
	<div class="lt">
		<div class="form">
		<form action="javascript:yt_search();" method="get">
			<button type="button" onclick="startVoice();"><i class="icon-mic"></i></button>
			<input id="text" placeholder="Hadi aramaya başlayalım..!" type="text" autocomplete="off" onfocus="if (window.CarKeyboard) CarKeyboard.showKeyboard();" value=""/>
			<button type="submit"><i class="icon-search"></i></button>
		</form>
		</div>
		<div class="results"></div>
	</div>


	<div class="rt">
		<div id="player"><p>Zihninde çalan o melodiyi, içinden mırıldandığın o ilk şarkıyı buraya bırak; ritmi başlatalım...</p></div>
	</div>
</div>

<script>
let player, ytReady = false;

function onYouTubeIframeAPIReady() {
    ytReady = true;
}

const yt = {
    history: [],
    index: -1,

    init(id) {
        if (!ytReady) return msg("err", "YouTube API henüz hazır değil");
        if (!id) return;

        // Açılan videonun listedeki konumunu bul
        const index = this.history.indexOf(id);
        if (index !== -1) this.index = index;

        $(".poster-card.active")?.classList.remove("active");
        $(`[data-id="${id}"]`)?.classList.add("active");

        if (player) return player.loadVideoById(id);

        player = new YT.Player('player', {
          width: '100%',
          height: '100%',
          videoId: id,
          playerVars: {
              autoplay: 1,
              playsinline: 1,
              controls: 0,
              disablekb: 1,
              loop: 0,
              fs: 0,
              iv_load_policy: 3,
              cc_load_policy: 0,
              rel: 0
          },
          events: {
              onApiChange: (event) => {
                  if (event.target.getOptions().includes('captions')) {
                      event.target.unloadModule('captions');
                  }
              }
          }
        });
    },
    // Video listesini ayarla ve seçilen videoyu başlat
    setList(ids, startIndex = 0) {
        if (!ytReady) return msg("err", "YouTube API henüz hazır değil");
        if (!Array.isArray(ids) || !ids.length) return;

        this.history = [...ids];
        this.index = Math.max(0, Math.min(
            Math.trunc(startIndex) || 0,
            ids.length - 1
        ));
        // İLk videoyu başlat
        //this.init(this.history[this.index]);
    },
    // Sonraki video
    next() {
        if (this.index >= this.history.length - 1) return;
        this.index++;
        this.init(this.history[this.index]);
    },
    // Önceki video
    prev() {
        if (this.index <= 0) return;
        this.index--;
        this.init(this.history[this.index]);
    },
    // Duraklat / Oynat
    toggle: () => {
        if (!player) return;
        player.getPlayerState() === YT.PlayerState.PLAYING
            ? player.pauseVideo()
            : player.playVideo();
    },

    play: () => player?.playVideo(),
    pause: () => player?.pauseVideo(),
    seek: s => player?.seekTo(s, true),
    forward: () => player?.seekTo(player.getCurrentTime() + 10, true),
    back: () => player?.seekTo(player.getCurrentTime() - 10, true),
    volume: v => player?.setVolume(v),
    mute: () => player?.mute(),
    unmute: () => player?.unMute(),
    time: () => player?.getCurrentTime() ?? 0,
    duration: () => player?.getDuration() ?? 0
};

    
// Şarkı değişince:
function deneme() {
  sendToCar({
    name: 'Tarkan',
    desc: 'Kuzu Kuzu',
    image: 'https://i.ytimg.com/vi/_GOZDXq7I-I/mqdefault.jpg',
    duration: 215,   // saniye. YouTube kullanıyorsanız: player.getDuration()
    position: 0,
    playing: true
  });
}
</script>

<div class="notice"></div>
</body>
</html>
