<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoX Andorid Auto</title>
<link rel="stylesheet" href="patch/styles/style.css">
<script src="patch/script/js.js" type="text/javascript" defer="defer"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<link rel="preconnect" href="https://www.youtube.com" crossorigin>
<link rel="preconnect" href="https://www.google.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="dns-prefetch" href="//rr1---sn.googlevideo.com">
<style type="text/css">
:root {
    --bg: #07101f;
    --panel: #0c192c;
    --panel-light: #10213a;
    --border: #1b3555;
    --text: #f1f6ff;
    --muted: #91a5c2;
    --purple: #168cff;
    --blue: #42b5ff;
}
</style>
<script type="application/javascript">
function testVoice() {
    const input = document.getElementById('text');

    if (!window.NativeSpeech ||
        typeof window.NativeSpeech.startListening !== 'function') {
        msg("err", "Android ses tanıma köprüsü bulunamadı.");
        return;
    }

    window.onNativeSpeechResult = function(text) {
        if (text.startsWith("Ses tanıma hatası:")) {
            msg("err", text);
            return;
        }

        if (input && text) {
            input.value = text;
            input.dispatchEvent(new Event('input', { bubbles: true }));
            msg("ok", "Konuşma algılandı: " + text);
        }
    };

    msg("ok", "Dinleniyor...");
    window.NativeSpeech.startListening();
}


window.addEventListener("autoxkey", function(event) {
    const keyCode = event.detail.keyCode;

    //msg("ok", "AutoX tuş kodu: " + keyCode);

    switch (keyCode) {
        case 87:
        	deneme();
            msg("ok", "Sonraki");
            break;

        case 88:
            msg("ok", "Önceki");
            AutoXMedia.setPlaying(true);   // duraklat simgesi (çalıyor)
            break;

        case 126:
            msg("ok", "Oynat");
            AutoXMedia.setPlaying(true);  // oynat simgesi
            break;

        case 127:
            msg("ok", "Duraklat");
            AutoXMedia.setPlaying(false);  // oynat simgesi
            break;

        default:
        	deneme();
            msg("ok", "Diğer tuş:" + keyCode);
            //AutoXMedia.setPlaying(true);   // duraklat simgesi (çalıyor)
            break;
    }
});
window.addEventListener('autoxseek', function (e) {
	msg("ok", "Pozisyon:" + e.detail.position);
	//player.seekTo(e.detail.position, true);
});

function sendToCar(track) {
  if (window.AutoXMedia) {
    AutoXMedia.setNowPlaying(JSON.stringify(track));
  }
}

</script>
</head>

<body>

<div class="yt_content">
	<div class="lt">
		<div class="form">
		<form action="javascript:yt_search();" method="get">
			<button type="button" onclick="testVoice();">
				<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
				  <defs>
				    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
				      <stop stop-color="#97e0ff"/>
				      <stop offset="1" stop-color="#1075ff"/>
				    </linearGradient>
				  </defs>
				  <g fill="url(#g)">
				    <path d="M50 67.813A17.813 17.813 0 0 0 67.813 50V20.313a17.813 17.813 0 0 0-35.626 0V50A17.813 17.813 0 0 0 50 67.813Z"/>
				    <path d="M73.75 41.094V50a23.75 23.75 0 0 1-47.5 0v-8.906a2.969 2.969 0 0 0-5.938 0V50a29.69 29.69 0 0 0 26.72 29.54v9.054a2.969 2.969 0 0 1-2.97 2.969h-2.968a2.969 2.969 0 0 0 0 5.937h17.812a2.969 2.969 0 0 0 0-5.937h-2.968a2.969 2.969 0 0 1-2.97-2.97V79.54A29.69 29.69 0 0 0 79.688 50v-8.906a2.969 2.969 0 0 0-5.937 0Z"/>
				  </g>
				</svg>
			</button>
			<input id="text" placeholder="Hadi aramaya başlayalım..!" type="text" autocomplete="off" onfocus="if (window.CarKeyboard) CarKeyboard.showKeyboard();" value=""/>
			<button type="submit">⌕</button>
		</form>
		</div>
		<div class="results"></div>
	</div>


	<div class="rt">
		<div id="player"><p>Zihninde çalan o melodiyi, içinden mırıldandığın o ilk şarkıyı buraya bırak; ritmi başlatalım...</p></div>
	</div>
</div>

<script>
// Şarkı değişince:
function deneme() {
  sendToCar({
    name: 'Tarkan',
    desc: 'Kuzu Kuzu',
    image: 'https://i.ytimg.com/vi/_GOZDXq7I-I/mqdefault.jpg',
    duration: 215,   // saniye. YouTube kullanıyorsanız: player.getDuration()
    position: 0,
    playing: true
  });
}
</script>

<div class="notice"></div>
</body>
</html>
