<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stream Player</title>
<link rel="stylesheet" href="patch/styles/style.css">
<script src="patch/script/js.js" type="text/javascript" defer="defer"></script>
<style type="text/css">
:root {
    --bg: #07101f;
    --panel: #0c192c;
    --panel-light: #10213a;
    --border: #1b3555;
    --text: #f1f6ff;
    --muted: #91a5c2;
    --purple: #168cff;
    --blue: #42b5ff;
}

.yt_content {
	display: flex;
	flex-direction: row;
	width: 100vw;
	height: 100vh;
	padding: 30px;
	gap: 30px;
}
.yt_content > div {
	padding: 9px;
	background: linear-gradient(145deg, #0e1d32, #091526);
	border: 1px solid var(--border);
	border-radius: 12px;
	box-shadow: 0 10px 35px #02081435;
}
.yt_content .lt {
	display: flex;
	flex-direction: column;
	flex-shrink: 0;
	flex-basis: 440px;
	color: #fff;
}
.yt_content .form {
	padding: 9px;
}
.yt_content .lt form {
	display: flex;
	flex-direction: row;
	width: 100%;
	height: 60px;
	border-radius: 30px;
	margin-bottom: 10px;
	border: 2px solid #174477;
	background: linear-gradient(100deg, #0c1d34, #09172a);
	box-shadow: 0 4px 18px rgba(0, 0, 0, 0.15);
	transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.yt_content .lt button[type=button] {
	flex-basis: 60px;
	color: #45b5ff;
	font-size: 18px;
	cursor: pointer;
}
.yt_content .lt button[type=button] svg {
	display: inline-block;
	width: 35px;
	vertical-align: middle;
}
.yt_content .lt input {
	flex-grow: 1;
	color: inherit;
	font-size: 16px;
}
.yt_content .lt input::placeholder {
	color: #7289a8;
}
.yt_content .lt button[type=submit] {
	flex-basis: 60px;
	color: #45b5ff;
	font-size: 38px;
	padding-bottom: 4px;
}

.results {
	display: flex;
	flex-direction: column;
	gap: 10px 0;
	padding: 0 9px;
	overflow: auto;
}
.poster-card {
	display: flex;
	flex-direction: row;
	padding: 5px;
	gap: 7px;
	cursor: pointer;
	border-color: #244b73;
	background: linear-gradient(110deg, #112b48, #0d2037);
}
.poster-card.active {
	background: linear-gradient(110deg, #12375c, #0d2340);
	border-color: #168cff;
	box-shadow: inset 3px 0 0 #168cff, 0 4px 18px #07101f30;
}
.poster-card:hover {
	transform: translateY(-1px);
}
.poster-card .image {
	flex-shrink: 0;
	align-content: center;
	flex-basis: 120px;
	height: 70px;
}
.poster-card img {
	display: block;
	width: 100%;
	height: 100%;
}
.poster-card .info {
	flex-grow: 1;
	align-self: center;
}
.poster-card h3 {
	font-size: 16px;
	max-height: 42px;
	overflow: hidden;
}
.poster-card p {
	color: var(--muted);
	font-size: 12px;
	line-height: 1.6;
	margin-top: 5px;
}
.poster-card .duration {
	align-self: center;
	margin-right: 7px;
	width: 43px;
	padding: 5px 7px;
	border: 1px solid #244568;
	border-radius: 6px;
	background: #10243b;
	color: #8fcaff;
	font-size: 11px;
	font-weight: 600;
	text-align: center;
	font-variant-numeric: tabular-nums;
}



.yt_content .rt {
	flex-grow: 1;
	align-content: center;
	text-align: center;
	padding: 18px;
}
.yt_content .rt p {
	padding: 20px 28px;
	color: #a9c9ed;
	font-size: 18px;
	font-weight: 400;
	line-height: 1.9;
	letter-spacing: 0.3px;
	background: linear-gradient(135deg,#a9c9ed 0%,#8b9dff 50%,#c3a6ff 100%);
	-webkit-background-clip: text;
	background-clip: text;
	-webkit-text-fill-color: transparent;
	filter: drop-shadow(0 0 14px #4b8dff20);
}
</style>
<script type="application/javascript">
function testVoice() {
  const input = document.getElementById('text');
msg("war",
  "SpeechRecognition: " + !!window.SpeechRecognition +
  "\nwebkitSpeechRecognition: " + !!window.webkitSpeechRecognition +
  "\nSecure context: " + window.isSecureContext
);
return;
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    msg("err", "Ses tanıma desteklenmiyor.");
    return;
  }

  const voice = new SpeechRecognition();
  voice.lang = 'tr-TR';
  voice.interimResults = true;
  voice.continuous = false;

  msg("ok", "Dinleniyor.");

  voice.onresult = function(event) {
  	msg("ok", "Konuşma algılandı.");
    input.value = Array.from(event.results)
      .map(result => result[0].transcript)
      .join('');
  };

  voice.onerror = function(event) {
    msg("err", event.error);
  };

  voice.onend = function() {
    if (input.value === "") {
      msg("err", "Dinleme sona erdi, sonuç alınamadı.");
    }
  };

  voice.start();
}
</script>
</head>

<body>

<div class="yt_content">
	<div class="lt">
		<div class="form">
		<form action='javascript:yt_search();' method='get'>
			<button type="button" onclick="testVoice();">
				<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
				  <defs>
				    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
				      <stop stop-color="#97e0ff"/>
				      <stop offset="1" stop-color="#1075ff"/>
				    </linearGradient>
				  </defs>
				  <g fill="url(#g)">
				    <path d="M50 67.813A17.813 17.813 0 0 0 67.813 50V20.313a17.813 17.813 0 0 0-35.626 0V50A17.813 17.813 0 0 0 50 67.813Z"/>
				    <path d="M73.75 41.094V50a23.75 23.75 0 0 1-47.5 0v-8.906a2.969 2.969 0 0 0-5.938 0V50a29.69 29.69 0 0 0 26.72 29.54v9.054a2.969 2.969 0 0 1-2.97 2.969h-2.968a2.969 2.969 0 0 0 0 5.937h17.812a2.969 2.969 0 0 0 0-5.937h-2.968a2.969 2.969 0 0 1-2.97-2.97V79.54A29.69 29.69 0 0 0 79.688 50v-8.906a2.969 2.969 0 0 0-5.937 0Z"/>
				  </g>
				</svg>
			</button>
			<input id='text' placeholder='Hadi aramaya başlayalım..!' type='text' autocomplete='off' value=''/>
			<button type='submit'>⌕</button>
		</form>
		</div>
		<div class="results"></div>
	</div>


	<div class="rt">
		<p>Zihninde çalan o melodiyi, içinden mırıldandığın o ilk şarkıyı buraya bırak; ritmi başlatalım...</p>
	</div>
</div>


<div class="notice"></div>
</body>
</html>
